<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Обратная связь</title>
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/media.css">

    <link rel="icon" type="image/x-icon" href="./img/favicons/favicon.svg">
    <link rel="apple-touch-icon" sizes="180x180" href="./img/favicons/apple-touch-icon.png">
</head>

<body>
    <article class="inner-page">
        <div class="container">
            <div class="inner-page-details">
                <h1 class="inner-page-title">Обратная связь</h1>
                <div class="inner-page-text">
                    <p>Заполните форму ниже чтобы связаться со мной</p>
                </div>
            </div>

            <!-- Форма обратной связи -->
            <form class="contact-form" id="feedbackForm">
                <div class="form-group">
                    <input type="text" name="name" placeholder="Ваше имя" required pattern="[A-Za-zА-Яа-яЁё\s]{2,}">
                </div>

                <div class="form-group">
                    <input type="email" name="email" placeholder="Ваш email" required>
                </div>

                <div class="form-group">
                    <input type="tel" name="phone" placeholder="Телефон" pattern="[\+\d\s\-\(\)]{10,}">
                </div>

                <div class="form-group">
                    <input type="url" name="website" placeholder="Ваш сайт (если есть)">
                </div>

                <div class="form-group">
                    <label>Оценка портфолио:</label>
                    <input type="range" name="rating" min="1" max="10" value="5"
                        onchange="document.getElementById('rangeValue').textContent = this.value">
                    <span id="rangeValue">5</span>/10
                </div>

                <div class="form-group">
                    <textarea name="message" placeholder="Ваше сообщение" rows="4"></textarea>
                </div>

                <button type="submit" class="btn">Отправить сообщение</button>
            </form>

            <a href="index.html" class="inner-page-backlink">
                <img src="img/icons/arrow-left.svg" alt="Назад на главную">
                Назад на главную
            </a>
        </div>
    </article>
<!--
    Не блокирует загрузку формы.    
    Пользователь сразу видит страницу, а скрипт выполняется "в фоне".
    Гарантированный доступ к форме, скрипт видит форму и может к ней обратиться.
-->
    <script>
        "use strict"; // Включение строгого режима 
        document.getElementById('feedbackForm').addEventListener('submit', function (e) {
            e.preventDefault();
            alert('Сообщение отправлено! Спасибо за обратную связь.');
            this.reset();
        });
    </script>
</body>

</html>
